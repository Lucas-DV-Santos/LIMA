<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Exemplo 2</title>

    
</head>
<body>
    <header style=" background-color: beige;">
        <h1 style="text-align: center;">Cadastro de alunos</h1>
    </header>

    <main>  
        <!-- Formulário do cadastro -->
        <form action="#" method="get">
            <!-- Nome do aluno -->
            <label for="nome">Nome do aluno</label>
            <input type="text" id="nome" name="nome" placeholder="Nome do aluno..." required>
            <br><br>

            <!-- Email do Aluno -->
            <label for="email">E-mail do aluno</label>
            <input type="email" id="email" name="email" placeholder="Email do aluno..." required>
            <br><br>

            <!-- Telefone do Aluno -->
            <label for="telefone">Telefone do aluno</label>
            <input type="tel" id="telefone" name="telefone" placeholder="Telefone do aluno..." required>
            <br><br>

            <!-- Data de nasciemnto  -->
            <label for="dataNascimento">Data de Nascimento</label>
            <input type="date" id="dataNascimento" name="dataNascimento" required>
            <br><br>

            <!-- Idade  -->
            <label for="idade">Idade do aluno</label>
            <input type="number" id="idade" name="idade" placeholder="Idade do aluno..." required>
            <br><br>

            <!-- Pergunta de seleção -->
            <label>
                Você estuda para as provas?
            </label>
            <br>
           <!-- Campo de escolha -->
            <label for="Sim">Sim, estudo</label>
            <input type="radio" value="Sim" id="Sim" name="Pergunta">
            <br>
            <label for="Nao">Não estudo</label>
            <input type="radio" value="Nao" id="Nao" name="Pergunta">
            <br><br>
            
            <!-- Campo range -->
             <label for="progesso">O quanto vc gosta das aulas do SENAI</label>
             <input type="range" id="progresso" name="progresso">
             <br>
             <br>

            <!-- Cor favorita -->
             <label for="cor">Escolha sua cor favorita</label>
             <input type="color" id="cor" name="cor">
             <br><br>

            <!-- Campo de seleção -->   
             <label for="opcao">Selecione sua sala</label>
             <select name="opcao" id="opcao">
                <!-- Criando opções -->
                 <option value="" selected disabled>Selecione...</option>
                 <option value="SalaVermelha">Sala Vermelha</option>
                 <option value="SalaAzul">Sala Azul</option>
                 <option value="SalaVerde">Sala Verde</option>
             </select>
             <br><br>

             <!-- Campo de Arquivo -->
              <label for="arquivo">Envie sua foto</label>
              <input type="file" name="arquivo" id="arquivo">
              <br><br>

            <!-- Textarea -->
             <label for="Observações">Observações</label>
             <textarea name="Observações" id="Observações" rows="8" cols="50"></textarea>
        
            <!-- Botão -->
            <button type="submit">Enviar</button>
        </form>
    </main>
</body>
</html>
