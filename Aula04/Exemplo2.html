<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Exemplo 2</title>
</head>
<body>
    <header style=" background-color: beige;">
        <h1 style="text-align: center;">Cadastro de alunos</h1>
    </header>

    <main>
        <!-- Formulário do cadastro -->
        <form action="#" method="get">
            <!-- Nome do aluno -->
            <label for="nome">Nome do aluno</label>
            <input type="text" id="nome" name="nome" placeholder="Nome do aluno..." required>
            <button type="submit">Enviar</button>
        </form>
    </main>
</body>
</html>
