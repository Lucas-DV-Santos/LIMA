<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Exemplo 1</title>
</head>
<body>
    <header style="background-color: beige;">
        <h1 style="text-align: center;">Formulário de Cadastro</h1>
    </header>

    <!-- Conteúdo principal -->
    <main>
        <!-- Formulário -->
        <!-- Action # mantém na mesma página -->
        <!-- Metodo GET faz envio pela  URL -->
        <form action="#" method="get">
            <!-- Primeiro Campo -->
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome" placeholder="Digite seu nome" required>
            <br><br>
            <label for="idade">Idade</label>
            <input type="number" name="idade" id="idade" placeholder="Digite sua idade">
            <br>
            <br>
            <button type="submit">Enviar</button>
        </form>
    </main>
   
</body>
</html>
