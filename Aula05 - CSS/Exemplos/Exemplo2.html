<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS interno com classe e ID</title>

    <!-- CSS INTERNO -->
     <style>
        *{
            background-color: aquamarine;
            margin: 0px;
            padding: 0px;
        }
        #paragrafo{
            font-size: 25px;
            background-color: red;
            color: white;
        }      
        #informacoes{
            background-color: blue;
            font-size: 30px;
            text-align: center;
        }
        .titulo{
            background-color: aqua;
            text-align: right;
            font-weight: bold;
        }
        div a{
            color: red;
        }
        div p{
            color: blue;
        }

     </style>
</head>
<body>
    <p id="paragrafo">Css aplicado no id</p>
    <p id="informacoes">Informações complementares</p>

    <h3 class="titulo">CSS aplicado na classe</h3>
    <h3 class="titulo">informacoes ccom classe</h3>

    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="titulo">Lucas</td>
                <td>17</td>
            </tr>
        </tbody>
    </table>

    <h3 class="bg-blue-500">Lucas</h3>

    <div>
        <a href="">Primeiro link</a>
        <p>Qualquer coisa</p>
    </div>
</body>
</html>
