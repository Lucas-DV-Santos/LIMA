<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Registro do usuário</h1>
    <form action="#" method="post">
        <label for="nome">Nome: </label>
        <input type="text" id="nome" name="nome" placeholder="Nome..." required>
        <br><br>
        <label for="Sobrenome">Sobrenome: </label>
        <input type="text" id="Sobrenome" name="Sobrenome" placeholder="Sobrenome..." required>
        <br><br>
        <label for="data">Data de Nascimento:   </label>
        <input type="date" id="data" name="data" placeholder="Data de nasciemnto..." required>
        <br><br>
        <p>Escolha sua linguagem favorita:</p>
        <input type="radio" id="Homem" name="Gênero" value="homem" required>
        <label for="Homem">Homem</label>
        <br><br>
        <input type="radio" id="Mulher" name="Gênero" value="mulher" required>
        <label for="Mulher">Mulher</label>
        <br><br>
        <label for="Email">Email: </label>
        <input type="email" id="Email" name="Email" placeholder="Email..." required>
        <br><br>
        <label for="Telefone">Telefone: </label>
        <input type="tel" id="Telefone" name="Telefone" placeholder="Telefone..." required>
        <br><br>
        <label for="Endereço">Endereço: </label>
        <input type="text" id="Endereço" name="Endereço" placeholder="Endereço..." >
        <br><br>
        <label for="Cidade">Cidade: </label>
        <input type="text" id="Cidade" name="Cidade" placeholder="Cidade..." required>
        <br><br>
        <label for="estado">Escolha um estado:</label>

        <select id="estado" name="estado">
            <option value="">Selecione...</option>
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="MG">Minas Gerais</option>
        </select>
    </form>
    </form>
</body>
</html>
