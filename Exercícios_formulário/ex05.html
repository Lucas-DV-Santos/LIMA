<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Inscrição em Evento</title>
</head>
<body>
    <h1>Inscrição em Evento</h1>
    <form>
        
        <label>Nome:</label>
        <input type="text" name="nome" placeholder="Digite seu nome" required><br><br>
        
        <label>E-mail:</label>
        <input type="email" name="email" placeholder="Digite seu e-mail" required><br><br>
        
        <label>Telefone:</label>
        <input type="tel" name="telefone" placeholder="(00) 00000-0000" pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}" required><br><br>
        
        <label>Cargo:</label>
        <input type="text" name="cargo" placeholder="Digite seu cargo" required><br><br>
        
        <label>Empresa:</label>
        <input type="text" name="empresa" placeholder="Digite o nome da empresa" required><br><br>
        
        <label>Data do Evento:</label>
        <input type="date" name="data_evento" required><br><br>
        
        <label>Horário de Chegada:</label>
        <input type="time" name="horario" required><br><br>
        
        <label>Alimentação Preferida:</label><br>
        <label>
            <input type="radio" name="alimentacao" value="Normal" required> Normal
        </label><br>
        <label>
            <input type="radio" name="alimentacao" value="Vegetariana"> Vegetariana
        </label><br>
        <label>
            <input type="radio" name="alimentacao" value="Vegana"> Vegana
        </label><br>
        <label>
            <input type="radio" name="alimentacao" value="Outra"> Outra
        </label><br><br>
        
        <label>Restrições Alimentares:</label><br>
        <label>
            <input type="checkbox" name="restricoes" value="Glúten"> Glúten
        </label><br>
        <label>
            <input type="checkbox" name="restricoes" value="Lactose"> Lactose
        </label><br>
        <label>
            <input type="checkbox" name="restricoes" value="Amendoim"> Amendoim
        </label><br>
        <label>
            <input type="checkbox" name="restricoes" value="Frutos do Mar"> Frutos do mar
        </label><br>
        <label>
            <input type="checkbox" name="restricoes" value="Nenhuma"> Nenhuma
        </label><br><br>
        
        <label>Necessidades Especiais:</label><br>
        <label>
            <input type="checkbox" name="necessidades" value="Acessibilidade"> Acessibilidade
        </label><br>
        <label>
            <input type="checkbox" name="necessidades" value="Intérprete de Libras"> Intérprete de Libras
        </label><br>
        <label>
            <input type="checkbox" name="necessidades" value="Acompanhamento"> Acompanhamento
        </label><br>
        <label>
            <input type="checkbox" name="necessidades" value="Nenhuma"> Nenhuma
        </label><br><br>
        <label>
            <input type="checkbox" name="privacidade" required> Aceito a Política de Privacidade
        </label><br><br>
        <label>
            <input type="checkbox" name="atualizacoes"> Receber Atualizações sobre o Evento
        </label><br><br>
        
        <h3>Dados do Acompanhante</h3>
        
        <label>Nome do Acompanhante:</label>
        <input type="text" name="nome_acompanhante" placeholder="Digite o nome do acompanhante"><br><br>
        
        <label>E-mail do Acompanhante:</label>
        <input type="email" name="email_acompanhante" placeholder="Digite o e-mail do acompanhante"><br><br>
        
        <label>Telefone do Acompanhante:</label>
        <input type="tel" name="telefone_acompanhante" placeholder="(00) 00000-0000" pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}"><br><br>
        
        <label>Data de Nascimento:</label>
        <input type="date" name="nascimento" required><br><br>
        
        <label>Empresa do Acompanhante:</label>
        <input type="text" name="empresa_acompanhante" placeholder="Digite a empresa do acompanhante"><br><br>
        
        <label>Cargo do Acompanhante:</label>
        <input type="text" name="cargo_acompanhante" placeholder="Digite o cargo do acompanhante"><br><br>
        
        <label>Preferência de Assento:</label>
        <select name="assento" required>
            <option value="" disabled>Selecione</option>
            <option value="Frente">Próximo ao palco</option>
            <option value="Meio">Meio do salão</option>
            <option value="Fundo">Fundo do salão</option>
            <option value="Corredor">Perto do corredor</option>
        </select><br><br>
        
        <label>Outras Informações Relevantes:</label><br>
        <textarea name="informacoes" placeholder="Digite outras informações relevantes"></textarea><br><br>
        <button type="submit">Realizar Inscrição</button>
    </form>
</body>
</html>
