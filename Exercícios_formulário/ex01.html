<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuário</title>
</head>
<body>
    <h1>Registro de Usuário</h1>
    <form>
        <label>Nome:</label>
        <input type="text" name="nome" placeholder="Digite seu nome" required><br><br>
        
        <label>Sobrenome:</label>
        <input type="text" name="sobrenome" placeholder="Digite seu sobrenome" required><br><br>
        
        <label>Data de Nascimento:</label>
        <input type="date" name="data" required><br><br>
        
        <label>Gênero:</label><br>
        
        <label>
            <input type="radio" name="genero" value="Masculino" required> Masculino
        </label><br>
        
        <label>
            <input type="radio" name="genero" value="Feminino"> Feminino
        </label><br>
        
        <label>
            <input type="radio" name="genero" value="Outro"> Outro
        </label><br><br>
        
        <label>E-mail:</label>
        <input type="email" name="email" placeholder="Digite seu e-mail" required><br><br>
        
        <label>Telefone:</label>
        <input type="tel" name="telefone" placeholder="Digite seu telefone" required><br><br>
        
        <label>Endereço:</label>
        <input type="text" name="endereco" placeholder="Digite seu endereço"><br><br>
        
        <label>Cidade:</label>
        <input type="text" name="cidade" placeholder="Digite sua cidade" required><br><br>
        
        <label>Estado:</label>
        <select name="estado" required>
            <option value="">Selecione</option>
            <option value="MG">Minas Gerais</option>
            <option value="SP">São Paulo</option>
            <option value="SE">Sergipe</option>
        </select><br><br>
        
        <label>CEP:</label>
        <input type="text" name="cep" placeholder="Digite seu CEP" required><br><br>
        
        <label>Nome de Usuário:</label>
        <input type="text" name="usuario" placeholder="Crie um nome de usuário" required><br><br>
        
        <label>Senha:</label>
        <input type="password" name="senha" required><br><br>
        
        <label>Confirmação de Senha:</label>
        <input type="password" name="confirmacao" required><br><br>
        
        <label>Foto de Perfil:</label>
        <input type="file" name="foto" accept="image/*"><br><br>
        
        <label>Hobbies:</label><br>
        <label>
            <input type="checkbox" name="hobbies" value="Esportes"> Esportes
        </label><br>
        <label>
            <input type="checkbox" name="hobbies" value="Música"> Música
        </label><br>
        <label>
            <input type="checkbox" name="hobbies" value="Leitura"> Leitura
        </label><br>
        <label>
            <input type="checkbox" name="hobbies" value="Jogos"> Jogos
        </label><br><br>
        
        <label>Nível de Educação:</label>
        <select name="educacao" required>
            <option value="" disabled>Selecione</option>
            <option value="Fundamental">Ensino Fundamental</option>
            <option value="Medio">Ensino Médio</option>
            <option value="Tecnico">Ensino Técnico</option>
            <option value="Superior">Ensino Superior</option>
            <option value="Pos-graduacao">Pós-graduação</option>
        </select><br><br>
        
        <label>Profissão:</label>
        <input type="text" name="profissao" placeholder="Digite sua profissão"><br><br>
        
        <label>Biografia:</label><br>
        <textarea name="biografia" placeholder="Escreva um pouco sobre você"></textarea><br><br>
        
        <label>
            <input type="checkbox" name="termos" required> Li e aceito os Termos e Condições
        </label><br><br>
        <label>
            <input type="checkbox" name="notificacoes"> Receber Notificações
        </label><br><br>
        
            <button type="submit">Registrar</button>
    </form>
</body>
</html>
